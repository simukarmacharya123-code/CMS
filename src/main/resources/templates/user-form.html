<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>User Form</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <div class="card">

        <div class="card-header bg-dark text-white">

            <h3 class="mb-0">
                User Management
            </h3>

        </div>

        <div class="card-body">

            <form
                    th:action="@{/users/save}"
                    th:object="${user}"
                    method="post">

                <input
                        type="hidden"
                        th:field="*{id}">


                <!-- Username -->

                <div class="mb-3">

                    <label class="form-label">
                        Username
                    </label>

                    <input
                            type="text"
                            th:field="*{username}"
                            class="form-control">

                    <div
                            class="text-danger"
                            th:if="${#fields.hasErrors('username')}"
                            th:errors="*{username}">
                    </div>

                </div>


                <!-- Email -->

                <div class="mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input
                            type="email"
                            th:field="*{email}"
                            class="form-control">

                    <div
                            class="text-danger"
                            th:if="${#fields.hasErrors('email')}"
                            th:errors="*{email}">
                    </div>

                </div>


                <!-- Role -->

                <div class="mb-3">

                    <label class="form-label">
                        Role
                    </label>

                    <select
                            th:field="*{role}"
                            class="form-select">

                        <option value="">
                            Select Role
                        </option>

                        <option value="ADMIN">
                            ADMIN
                        </option>

                        <option value="MANAGER">
                            MANAGER
                        </option>

                        <option value="USER">
                            USER
                        </option>

                    </select>

                    <div
                            class="text-danger"
                            th:if="${#fields.hasErrors('role')}"
                            th:errors="*{role}">
                    </div>

                </div>


                <button
                        type="submit"
                        class="btn btn-success">

                    Save User

                </button>

                <a
                        href="/users"
                        class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>
