<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Consultant Management Dashboard</title>

    <!-- Bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        body {
            background-color: #f5f7fb;
        }

        .dashboard-header {
            background: #212529;
            color: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .stat-card {
            border: none;
            border-radius: 12px;
            padding: 20px;
            height: 100%;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        .stat-title {
            font-size: 15px;
            color: #6c757d;
            margin-bottom: 8px;
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
        }

        .dashboard-actions {
            margin-top: 30px;
        }

        .chart-card {
            border: none;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
            background-color: white;
        }

        .chart-container {
            position: relative;
            height: 350px;
        }

    </style>

</head>

<body>

<div class="container py-4">

    <!-- ========================= -->
    <!-- Dashboard Header -->
    <!-- ========================= -->

    <div class="dashboard-header">

        <h1>
            Consultant Management Dashboard
        </h1>

        <p class="mb-0">
            Overview of consultant information and status
        </p>

    </div>


    <!-- ========================= -->
    <!-- Dashboard Statistics -->
    <!-- ========================= -->

    <div class="row g-4">


        <!-- Total Consultants -->

        <div class="col-md-6 col-lg-4">

            <div class="card stat-card">

                <div class="stat-title">
                    Total Consultants
                </div>

                <div class="stat-number"
                     th:text="${totalConsultants}">

                    0

                </div>

            </div>

        </div>


        <!-- Active Consultants -->

        <div class="col-md-6 col-lg-4">

            <div class="card stat-card">

                <div class="stat-title">
                    Active Consultants
                </div>

                <div class="stat-number"
                     th:text="${activeConsultants}">

                    0

                </div>

            </div>

        </div>


        <!-- Available Consultants -->

        <div class="col-md-6 col-lg-4">

            <div class="card stat-card">

                <div class="stat-title">
                    Available Consultants
                </div>

                <div class="stat-number"
                     th:text="${availableConsultants}">

                    0

                </div>

            </div>

        </div>


        <!-- On Project -->

        <div class="col-md-6 col-lg-4">

            <div class="card stat-card">

                <div class="stat-title">
                    On Project
                </div>

                <div class="stat-number"
                     th:text="${onProjectConsultants}">

                    0

                </div>

            </div>

        </div>


        <!-- New Consultants -->

        <div class="col-md-6 col-lg-4">

            <div class="card stat-card">

                <div class="stat-title">
                    New Consultants
                </div>

                <div class="stat-number"
                     th:text="${newConsultants}">

                    0

                </div>

            </div>

        </div>

    </div>


    <!-- ========================= -->
    <!-- Charts -->
    <!-- ========================= -->

    <div class="row mt-4">


        <!-- ========================= -->
        <!-- Consultant Status Chart -->
        <!-- ========================= -->

        <div class="col-lg-6 mb-4">

            <div class="chart-card">

                <h4 class="mb-4">
                    Consultant Status Distribution
                </h4>

                <div class="chart-container">

                    <canvas id="statusChart"></canvas>

                </div>

            </div>

        </div>


        <!-- ========================= -->
        <!-- Technology Chart -->
        <!-- ========================= -->

        <div class="col-lg-6 mb-4">

            <div class="chart-card">

                <h4 class="mb-4">
                    Consultants by Technology
                </h4>

                <div class="chart-container">

                    <canvas id="technologyChart"></canvas>

                </div>

            </div>

        </div>

    </div>


    <!-- ========================= -->
    <!-- Navigation Buttons -->
    <!-- ========================= -->

    <div class="dashboard-actions">

        <a href="/consultants"
           class="btn btn-dark me-2">

            View Consultants

        </a>


        <a href="/consultants/new"
           class="btn btn-primary">

            Add Consultant

        </a>

    </div>

</div>


<!-- ========================= -->
<!-- Charts JavaScript -->
<!-- ========================= -->

<script th:inline="javascript">


    /* ==========================================
       CONSULTANT STATUS DATA
       ========================================== */

    const activeConsultants =
        /*[[${activeConsultants}]]*/ 0;

    const availableConsultants =
        /*[[${availableConsultants}]]*/ 0;

    const onProjectConsultants =
        /*[[${onProjectConsultants}]]*/ 0;

    const inactiveConsultants =
        /*[[${inactiveConsultants}]]*/ 0;


    /* ==========================================
       CREATE CONSULTANT STATUS CHART
       ========================================== */

    const statusCanvas =
        document.getElementById('statusChart');

    const statusCtx =
        statusCanvas.getContext('2d');


    new Chart(statusCtx, {

        type: 'doughnut',

        data: {

            labels: [
                'Active',
                'Available',
                'On Project',
                'Inactive'
            ],

            datasets: [

                {

                    label: 'Consultants',

                    data: [

                        activeConsultants,
                        availableConsultants,
                        onProjectConsultants,
                        inactiveConsultants

                    ],

                    borderWidth: 2

                }

            ]

        },

        options: {

            responsive: true,

            maintainAspectRatio: false,

            plugins: {

                legend: {

                    position: 'bottom'

                }

            }

        }

    });


    /* ==========================================
       TECHNOLOGY DATA
       ========================================== */

    const technologyData =
        /*[[${technologyData}]]*/ [];


    /* ==========================================
       GET TECHNOLOGY NAMES
       ========================================== */

    const technologyLabels =
        technologyData.map(function (item) {

            return item[0];

        });


    /* ==========================================
       GET TECHNOLOGY COUNTS
       ========================================== */

    const technologyCounts =
        technologyData.map(function (item) {

            return item[1];

        });


    /* ==========================================
       CREATE TECHNOLOGY CHART
       ========================================== */

    const technologyCanvas =
        document.getElementById('technologyChart');

    const technologyCtx =
        technologyCanvas.getContext('2d');


    new Chart(technologyCtx, {

        type: 'bar',

        data: {

            labels: technologyLabels,

            datasets: [

                {

                    label: 'Number of Consultants',

                    data: technologyCounts,

                    borderWidth: 1

                }

            ]

        },

        options: {

            responsive: true,

            maintainAspectRatio: false,

            scales: {

                y: {

                    beginAtZero: true,

                    ticks: {

                        stepSize: 1

                    }

                }

            },

            plugins: {

                legend: {

                    display: false

                }

            }

        }

    });

</script>


</body>

</html>
