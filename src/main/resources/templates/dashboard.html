<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Consultant Dashboard</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/consultants/dashboard">
            Consultant Management
        </a>
    </div>
</nav>

<div class="container mt-5">

    <h1 class="mb-4">Consultant Management Dashboard</h1>

    <div class="card shadow-sm" style="max-width: 400px;">

        <div class="card-body text-center">

            <h5 class="card-title">Total Consultants</h5>

            <h1 class="display-4" th:text="${totalConsultants}">
                0
            </h1>

            <div class="mt-4">

                <a href="/consultants"
                   class="btn btn-primary me-2">
                    View Consultants
                </a>

                <a href="/consultants/new"
                   class="btn btn-success">
                    Add Consultant
                </a>

            </div>

        </div>

    </div>

</div>

</body>
</html>
