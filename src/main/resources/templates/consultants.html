<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Consultant Management</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/consultants/dashboard">
            Consultant Management
        </a>
    </div>
</nav>

<div class="container mt-5">

    <!-- Page Heading -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <h1>Consultants</h1>

        <a href="/consultants/new" class="btn btn-success">
            Add Consultant
        </a>

    </div>


    <!-- Search -->
    <form action="/consultants" method="get" class="row g-2 mb-4">

        <div class="col-md-6">

            <input
                    type="text"
                    name="keyword"
                    th:value="${keyword}"
                    class="form-control"
                    placeholder="Search by name or technology">

        </div>

        <div class="col-auto">

            <button type="submit" class="btn btn-primary">
                Search
            </button>

        </div>

        <div class="col-auto">

            <a href="/consultants" class="btn btn-secondary">
                Clear
            </a>

        </div>

    </form>


    <!-- Consultant Table -->
    <div class="table-responsive">

        <table class="table table-bordered table-striped table-hover">

            <thead class="table-dark">

            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Technology</th>
                <th>Experience</th>
                <th>Actions</th>
            </tr>

            </thead>


            <tbody>

            <tr th:each="consultant : ${consultants}">

                <td th:text="${consultant.id}"></td>

                <td th:text="${consultant.name}"></td>

                <td th:text="${consultant.email}"></td>

                <td th:text="${consultant.phone}"></td>

                <td th:text="${consultant.technology}"></td>

                <td th:text="${consultant.experience}"></td>

                <td>

                    <a
                            th:href="@{/consultants/edit/{id}(id=${consultant.id})}"
                            class="btn btn-sm btn-primary">
                        Edit
                    </a>

                    <a
                            th:href="@{/consultants/delete/{id}(id=${consultant.id})}"
                            class="btn btn-sm btn-danger">
                        Delete
                    </a>

                </td>

            </tr>

            </tbody>

        </table>

    </div>


    <!-- Back to Dashboard -->
    <div class="mt-3">

        <a href="/consultants/dashboard" class="btn btn-outline-dark">
            Back to Dashboard
        </a>

    </div>

</div>


<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
