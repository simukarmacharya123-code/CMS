<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Error - Consultant Management</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/consultants">
            Consultant Management
        </a>
    </div>
</nav>

<div class="container mt-5">

    <div class="alert alert-danger text-center">

        <h1 class="mb-3">Something went wrong</h1>

        <p th:text="${errorMessage}">
            Something went wrong. Please try again later.
        </p>

        <a href="/consultants" class="btn btn-primary">
            Back to Consultants
        </a>

        <a href="/consultants/dashboard" class="btn btn-secondary">
            Back to Dashboard
        </a>

    </div>

</div>

</body>
</html>
