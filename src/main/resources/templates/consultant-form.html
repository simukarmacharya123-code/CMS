<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Consultant Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h1 {
            margin-bottom: 25px;
        }

        div {
            margin-bottom: 15px;
        }

        label {
            display: inline-block;
            width: 120px;
            font-weight: bold;
        }

        input,
        select {
            padding: 8px;
            width: 300px;
            box-sizing: border-box;
        }

        span {
            color: red;
            margin-left: 10px;
        }

        button {
            padding: 10px 20px;
            background-color: #198754;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #157347;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #6c757d;
            color: white;
            text-decoration: none;
        }

        a:hover {
            background-color: #5c636a;
        }
    </style>
</head>

<body>

<h1>Consultant Form</h1>

<form th:action="@{/consultants/save}"
      th:object="${consultant}"
      method="post">

    <!-- Keeps the existing ID when editing -->
    <input type="hidden" th:field="*{id}">

    <div>
        <label>Name:</label>
        <input type="text" th:field="*{name}">

        <span th:if="${#fields.hasErrors('name')}"
              th:errors="*{name}"></span>
    </div>


    <div>
        <label>Email:</label>
        <input type="text" th:field="*{email}">

        <span th:if="${#fields.hasErrors('email')}"
              th:errors="*{email}"></span>
    </div>


    <div>
        <label>Phone:</label>
        <input type="text" th:field="*{phone}">

        <span th:if="${#fields.hasErrors('phone')}"
              th:errors="*{phone}"></span>
    </div>


    <div>
        <label>Technology:</label>
        <input type="text" th:field="*{technology}">

        <span th:if="${#fields.hasErrors('technology')}"
              th:errors="*{technology}"></span>
    </div>


    <div>
        <label>Experience:</label>
        <input type="number" th:field="*{experience}">

        <span th:if="${#fields.hasErrors('experience')}"
              th:errors="*{experience}"></span>
    </div>


    <!-- Consultant Status -->
    <div>
        <label>Status:</label>

        <select th:field="*{status}">

            <option value="Available">
                Available
            </option>

            <option value="Active">
                Active
            </option>

            <option value="On Project">
                On Project
            </option>

            <option value="Inactive">
                Inactive
            </option>

        </select>
    </div>


    <br>

    <button type="submit">
        Save Consultant
    </button>

</form>

<br>

<a th:href="@{/consultants}">
    Back to Consultants
</a>

</body>

</html>
